// ChatYUE 根构建脚本
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // 7.2.x 对 minSdkVersion 下限最宽松，且不强制 AndroidX
        classpath 'com.android.tools.build:gradle:7.2.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
